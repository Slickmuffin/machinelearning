displayName: PPO-ARCHITECTURAL-FIXES
jobSpec:
  workerPoolSpecs:
  - machineSpec:
      machineType: n1-standard-4
      acceleratorType: NVIDIA_TESLA_T4
      acceleratorCount: 1
    replicaCount: 1
    diskSpec:
      bootDiskType: pd-ssd
      bootDiskSizeGb: 100
    containerSpec:
      imageUri: gcr.io/YOUR_GCP_PROJECT/ppo-trading-ai-architectural-fixes:latest
      command:
      - python3
      - /app/ppo_trading_agent.py
      env:
      - name: PYTHONPATH
        value: /app
      - name: PYTHONUNBUFFERED
        value: "1"
      - name: CUDA_VISIBLE_DEVICES
        value: "0"
      - name: TRAINING_DATA_URI
        value: "data/processed/btc_comprehensive_dataset_20250812_125933_features.csv"
      - name: AIP_MODEL_DIR
        value: "gs://YOUR_GCP_PROJECT-ml-trading-central/ppo-models"