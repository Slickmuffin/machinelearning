displayName: PPO-RISK-AWARE-CONTINUOUS-ACTIONS
jobSpec:
  workerPoolSpecs:
  - machineSpec:
      machineType: n1-standard-8
      acceleratorType: NVIDIA_TESLA_T4
      acceleratorCount: 1
    replicaCount: 1
    diskSpec:
      bootDiskType: pd-ssd
      bootDiskSizeGb: 100
    containerSpec:
      imageUri: gcr.io/YOUR_GCP_PROJECT/ppo-trading-ai-fixed:latest
      command:
      - python3
      - /app/train_ppo_vertex.py
      args:
      - --num_envs=16
      - --num_updates=1000
      env:
      - name: PYTHONPATH
        value: /app
      - name: CUDA_VISIBLE_DEVICES
        value: "0"