steps:
- name: 'gcr.io/cloud-builders/docker'
  args:
  - 'build'
  - '-t'
  - 'gcr.io/${PROJECT_ID}/ppo-trading-ai-architectural-fixes:latest'
  - '-f'
  - 'Dockerfile'
  - '.'

- name: 'gcr.io/cloud-builders/docker'
  args:
  - 'push'
  - 'gcr.io/${PROJECT_ID}/ppo-trading-ai-architectural-fixes:latest'

images:
- 'gcr.io/${PROJECT_ID}/ppo-trading-ai-architectural-fixes:latest'

options:
  machineType: 'E2_HIGHCPU_8'
  diskSizeGb: 100