data:
  symbol: "BTC/USDT"
  timeframes:
    primary: "1d"
    context: ["4h", "1d", "1w"]
  history_days: 730
  exchange: "binance"

features:
  returns:
    periods: [1, 3, 7, 14]
  ema:
    periods: [10, 21, 50, 200]
  atr:
    period: 14
  volatility:
    period: 30
  vwap:
    period: 20
  roc:
    periods: [7, 14, 30]
  support_resistance:
    lookback_days: 90
    min_touches: 3
  
labels:
  horizon_days: 3
  threshold_bp: 300  # basis points (3% for swing trades)
  meta_label_vol_threshold: 0.02
  min_trade_gap_days: 1  # Minimum 1 day between trades

model:
  type: "xgboost"
  params:
    n_estimators: 300
    max_depth: 6
    learning_rate: 0.1
    subsample: 0.8
    colsample_bytree: 0.8
    random_state: 42
  calibration:
    method: "isotonic"
    cv_folds: 3

training:
  walk_forward:
    train_days: 180
    test_days: 30
    min_samples: 1000
  validation_split: 0.2

execution:
  paper_trading: true
  position_sizing:
    method: "confidence"
    max_size_usd: 10000
    min_confidence: 0.8
  order_type: "limit"
  post_only: true
  max_trades_per_day: 1
  min_hours_between_trades: 24
  
risk:
  daily_drawdown_limit: 0.05
  weekly_drawdown_limit: 0.10
  max_positions: 1
  kill_switch:
    enabled: true
    price_anomaly_threshold: 0.1
    api_error_threshold: 5

alerts:
  discord:
    enabled: true
    channels:
      trades: true
      errors: true
      performance: true

vertex_ai:
  project_id: "your-project"
  region: "us-central1"
  training:
    machine_type: "n1-standard-4"
    container_uri: "gcr.io/your-project/trading-trainer:latest"
  serving:
    machine_type: "n1-standard-2"
    container_uri: "gcr.io/your-project/trading-server:latest"
  vizier:
    study_id: "trading-hpo-study"
    max_trials: 50