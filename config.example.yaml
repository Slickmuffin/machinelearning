data:
  symbol: "BTC/USDT"
  timeframes:
    primary: "1m"
    context: ["5m", "15m", "1h"]
  history_days: 365
  exchange: "binance"

features:
  returns:
    periods: [1, 3, 5]
  ema:
    periods: [20, 60]
  atr:
    period: 14
  volatility:
    period: 60
  vwap:
    period: 60
  roc:
    periods: [10, 30]
  
labels:
  horizon_minutes: 15
  threshold_bp: 50  # basis points
  meta_label_vol_threshold: 0.001

model:
  type: "xgboost"
  params:
    n_estimators: 300
    max_depth: 6
    learning_rate: 0.1
    subsample: 0.8
    colsample_bytree: 0.8
    random_state: 42
  calibration:
    method: "isotonic"
    cv_folds: 3

training:
  walk_forward:
    train_days: 180
    test_days: 30
    min_samples: 1000
  validation_split: 0.2

execution:
  paper_trading: true
  position_sizing:
    method: "confidence"
    max_size_usd: 1000
    min_confidence: 0.6
  order_type: "market"
  post_only: true
  
risk:
  daily_drawdown_limit: 0.05
  weekly_drawdown_limit: 0.10
  max_positions: 1
  kill_switch:
    enabled: true
    price_anomaly_threshold: 0.1
    api_error_threshold: 5

alerts:
  discord:
    enabled: true
    channels:
      trades: true
      errors: true
      performance: true

vertex_ai:
  project_id: "your-project"
  region: "us-central1"
  training:
    machine_type: "n1-standard-4"
    container_uri: "gcr.io/your-project/trading-trainer:latest"
  serving:
    machine_type: "n1-standard-2"
    container_uri: "gcr.io/your-project/trading-server:latest"
  vizier:
    study_id: "trading-hpo-study"
    max_trials: 50